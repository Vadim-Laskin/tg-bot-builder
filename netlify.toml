[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Структура сайта:
#   /      — информационный сайт (папка site/, не связан с конструктором)
#   /cp/   — сам конструктор (React-приложение, собирается в dist/cp)
#   /.netlify/functions/* — бэкенд (вебхук Telegram и т.д.)

[[redirects]]
  from = "/cp"
  to = "/cp/"
  status = 301

# SPA-фолбэк только внутри /cp — главная и её страницы не затрагиваются.
# (Реальные файлы — js/css/стикеры — Netlify отдаёт раньше этого правила.)
[[redirects]]
  from = "/cp/*"
  to = "/cp/index.html"
  status = 200
